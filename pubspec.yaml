name: route_fix
description: >-
  RouteFix — desktop network routing diagnostics for developers.
  Not a speed test.
publish_to: 'none'

# App version: MAJOR.MINOR.PATCH+BUILD (SemVer). Keep AppInfo in sync.
# Release tags must match: vMAJOR.MINOR.PATCH (see .github/workflows/release.yml).
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  image_path: assets/icon/app_icon.png
  macos:
    generate: true
  windows:
    generate: true
  linux:
    generate: true
  web:
    generate: true

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
