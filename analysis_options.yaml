# Analyzer / linter for RouteFix.
include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # Private injected deps intentionally use:
    #   Foo({required Bar bar}) : _bar = bar;
    # Forcing `this._bar` makes call sites uglier (`_bar:`). Keep public names.
    prefer_initializing_formals: false
    use_super_parameters: false
